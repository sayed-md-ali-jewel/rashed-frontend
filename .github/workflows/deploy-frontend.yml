name: Build and Deploy Frontend to Webuzo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & Deploy Next.js Frontend
    runs-on: ubuntu-22.04

    env:
      # Frontend Application Environment
      NODE_ENV: production
      PORT: ${{ vars.PORT || '3000' }}
      HOSTNAME: ${{ vars.HOSTNAME || '0.0.0.0' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STRAPI_URL: ${{ vars.NEXT_PUBLIC_STRAPI_URL || secrets.NEXT_PUBLIC_STRAPI_URL }}
      STRAPI_API_URL: ${{ vars.STRAPI_API_URL || secrets.STRAPI_API_URL }}
      STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN || vars.STRAPI_API_TOKEN }}
      MONGODB_URI: ${{ secrets.MONGODB_URI || vars.MONGODB_URI }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET || vars.REVALIDATE_SECRET }}
      ADMIN_DEMO_USER: ${{ vars.ADMIN_DEMO_USER || secrets.ADMIN_DEMO_USER }}
      ADMIN_DEMO_PIN: ${{ secrets.ADMIN_DEMO_PIN || vars.ADMIN_DEMO_PIN }}

      # Webuzo FTP Connection
      FTP_SERVER: ${{ secrets.FRONTEND_FTP_SERVER || vars.FRONTEND_FTP_SERVER || secrets.FTP_SERVER || vars.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FRONTEND_FTP_USERNAME || vars.FRONTEND_FTP_USERNAME || secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FRONTEND_FTP_PASSWORD || vars.FRONTEND_FTP_PASSWORD || secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FRONTEND_FTP_SERVER_DIR || 'public_html/drrashed.bd/frontend/' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deploy configuration
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret/variable: $name"
              missing=1
            fi
          done
          if [ "$FTP_PROTOCOL" != "ftp" ] && [ "$FTP_PROTOCOL" != "ftps" ]; then
            echo "::error::FTP_PROTOCOL must be either ftp or ftps. Use an SFTP action instead if your server only supports SFTP."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy Next.js standalone build artifacts
          if [ -d .next/standalone/frontend ]; then
            cp -r .next/standalone/frontend/. deploy/
          elif [ -d .next/standalone ]; then
            cp -r .next/standalone/. deploy/
          fi

          # Copy required static assets and public directory for standalone runtime
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then
            cp -r public deploy/public
          fi

          # Ensure server entry points (both server.js and app.js for Webuzo/Passenger)
          if [ -f deploy/server.js ]; then
            cp deploy/server.js deploy/app.js
          fi

          # Passenger / Webuzo restart signal
          mkdir -p deploy/tmp
          echo "restarted at $(date -u +%Y-%m-%dT%H:%M:%SZ) - ${GITHUB_SHA}" > deploy/tmp/restart.txt

          # Write production environment files
          {
            echo "NODE_ENV=production"
            echo "PORT=${PORT}"
            echo "HOSTNAME=${HOSTNAME}"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "NEXT_PUBLIC_STRAPI_URL=${NEXT_PUBLIC_STRAPI_URL}"
            echo "STRAPI_API_URL=${STRAPI_API_URL}"
            echo "STRAPI_API_TOKEN=${STRAPI_API_TOKEN}"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "REVALIDATE_SECRET=${REVALIDATE_SECRET}"
            echo "ADMIN_DEMO_USER=${ADMIN_DEMO_USER}"
            echo "ADMIN_DEMO_PIN=${ADMIN_DEMO_PIN}"
          } > deploy/.env.production
          cp deploy/.env.production deploy/.env

      - name: Upload to Webuzo by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          port: ${{ env.FTP_PORT }}
          local-dir: ./deploy/
          server-dir: ${{ env.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
