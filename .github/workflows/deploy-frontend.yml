name: Build and Deploy to Webuzo

on:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Wipe remote state and perform full clean sync'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-22.04

    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      MONGODB_URI: ${{ vars.MONGODB_URI || secrets.MONGODB_URI }}
      REVALIDATE_SECRET: ${{ vars.REVALIDATE_SECRET || secrets.REVALIDATE_SECRET }}
      ADMIN_DEMO_USER: ${{ vars.ADMIN_DEMO_USER || secrets.ADMIN_DEMO_USER }}
      ADMIN_DEMO_PIN: ${{ vars.ADMIN_DEMO_PIN || secrets.ADMIN_DEMO_PIN }}
      FTP_SERVER: ${{ vars.FTP_SERVER || secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ vars.FTP_USERNAME || secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ vars.FTP_PASSWORD || secrets.FTP_PASSWORD }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || secrets.FTP_PROTOCOL || 'ftp' }}
      FTP_PORT: ${{ vars.FTP_PORT || secrets.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || vars.SERVER_DIR || secrets.FTP_SERVER_DIR || secrets.SERVER_DIR || './' }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate deploy variables
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable/secret: $name"
              missing=1
            fi
          done
          if [ "$FTP_PROTOCOL" != "ftp" ] && [ "$FTP_PROTOCOL" != "ftps" ]; then
            echo "::error::FTP_PROTOCOL must be either ftp or ftps. Use an SFTP action instead if your server only supports SFTP."
            missing=1
          fi
          exit "$missing"

      - name: Build Next.js
        run: npm run build

      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy Next.js standalone build artifacts
          if [ -d .next/standalone/frontend ]; then
            cp -r .next/standalone/frontend/. deploy/
          elif [ -d .next/standalone ]; then
            cp -r .next/standalone/. deploy/
          fi

          # Copy static files and public directory
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then
            cp -r public deploy/public
          fi
          mkdir -p deploy/public/uploads

          # Clean up local environment and git traces
          rm -rf deploy/.git deploy/.github deploy/.env.local deploy/.env.example

          # Passenger / Webuzo restart signal
          mkdir -p deploy/tmp
          echo "restarted at $(date -u +%Y-%m-%dT%H:%M:%SZ) - ${GITHUB_SHA}" > deploy/tmp/restart.txt

          # Configure server binding and app.js for Webuzo/Passenger
          if [ -f deploy/server.js ]; then
            node -e "const fs=require('fs');const p='deploy/server.js';let s=fs.readFileSync(p,'utf8');s=s.replace(\"process.env.HOSTNAME || '0.0.0.0'\", \"process.env.HOSTNAME || '127.0.0.1'\");fs.writeFileSync(p,s);"
            cp deploy/server.js deploy/app.js
          fi

          if [ -f deploy/package.json ]; then
            node -e "const fs=require('fs');const p='deploy/package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.scripts={start:'node server.js'};pkg.main='server.js';pkg.engines={node:'20.x'};fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          fi

          # Write production environment files
          {
            echo "NODE_ENV=production"
            echo "HOSTNAME=127.0.0.1"
            echo "PORT=3000"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "REVALIDATE_SECRET=${REVALIDATE_SECRET}"
            echo "ADMIN_DEMO_USER=${ADMIN_DEMO_USER}"
            echo "ADMIN_DEMO_PIN=${ADMIN_DEMO_PIN}"
          } > deploy/.env.production
          cp deploy/.env.production deploy/.env

          # Normalize target server directory: strip all leading slashes, default to './'
          RAW_DIR="${FTP_SERVER_DIR:-./}"
          CLEAN_DIR="$(echo "$RAW_DIR" | sed -E 's|^[./]*||; s|/+$||')"
          if [ -z "$CLEAN_DIR" ]; then
            FINAL_DIR="./"
          else
            FINAL_DIR="${CLEAN_DIR}/"
          fi
          echo "NORMALIZED_SERVER_DIR=${FINAL_DIR}" >> "$GITHUB_ENV"
          echo "Normalized FTP target directory to: ${FINAL_DIR}"

      - name: Upload to Webuzo by LFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          PROTOCOL="${FTP_PROTOCOL:-ftp}"
          PORT="${FTP_PORT:-21}"

          if [ "$PROTOCOL" = "ftps" ]; then
            SSL_CMDS="set ftp:ssl-force true; set ftp:ssl-protect-data true;"
          else
            SSL_CMDS="set ftp:ssl-allow yes;"
          fi

          echo "Starting LFTP sync to ${FTP_SERVER}:${PORT} at ${NORMALIZED_SERVER_DIR}..."

          lftp << EOF
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          ${SSL_CMDS}
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p ${PORT} "${FTP_SERVER}"
          mirror -R --delete --parallel=5 \
            --exclude-glob .git* \
            --exclude-glob .git*/** \
            --exclude-glob public/uploads/** \
            --exclude-glob uploads/** \
            --exclude-glob .ftp-deploy-sync-state* \
            deploy/ "${NORMALIZED_SERVER_DIR}"
          quit
          EOF
