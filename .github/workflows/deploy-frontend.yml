name: Build and Deploy to Webuzo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-22.04

    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || secrets.NEXT_PUBLIC_SITE_URL }}
      MONGODB_URI: ${{ vars.MONGODB_URI || secrets.MONGODB_URI }}
      REVALIDATE_SECRET: ${{ vars.REVALIDATE_SECRET || secrets.REVALIDATE_SECRET }}
      ADMIN_DEMO_USER: ${{ vars.ADMIN_DEMO_USER || secrets.ADMIN_DEMO_USER }}
      ADMIN_DEMO_PIN: ${{ vars.ADMIN_DEMO_PIN || secrets.ADMIN_DEMO_PIN }}
      DEPLOY_SERVER: ${{ vars.DEPLOY_SERVER || secrets.DEPLOY_SERVER || vars.FTP_SERVER || secrets.FTP_SERVER }}
      DEPLOY_USERNAME: ${{ vars.DEPLOY_USERNAME || secrets.DEPLOY_USERNAME || vars.FTP_USERNAME || secrets.FTP_USERNAME }}
      DEPLOY_PASSWORD: ${{ vars.DEPLOY_PASSWORD || secrets.DEPLOY_PASSWORD || vars.FTP_PASSWORD || secrets.FTP_PASSWORD }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || vars.FTP_PORT || secrets.FTP_PORT || '21' }}
      DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || secrets.DEPLOY_REMOTE_DIR || vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate deploy variables
        run: |
          missing=0
          for name in DEPLOY_SERVER DEPLOY_USERNAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable/secret: $name (or FTP_$name)"
              missing=1
            fi
          done
          if [ -z "$DEPLOY_PASSWORD" ] && [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing authentication: provide either DEPLOY_PASSWORD (or FTP_PASSWORD) or SSH_PRIVATE_KEY"
            missing=1
          fi
          exit "$missing"

      - name: Build Next.js
        run: npm run build

      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy Next.js standalone build artifacts
          if [ -d .next/standalone/frontend ]; then
            cp -r .next/standalone/frontend/. deploy/
          elif [ -d .next/standalone ]; then
            cp -r .next/standalone/. deploy/
          fi

          # Copy static files and public directory
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          mkdir -p deploy/_next
          cp -r .next/static deploy/_next/static
          if [ -d public ]; then
            cp -r public deploy/public
          fi

          # Clean up local environment and git traces
          rm -rf deploy/.git deploy/.github deploy/.env.local deploy/.env.example

          # Passenger / Webuzo restart signal
          mkdir -p deploy/tmp
          echo "restarted at $(date -u +%Y-%m-%dT%H:%M:%SZ) - ${GITHUB_SHA}" > deploy/tmp/restart.txt

          # Configure server binding and app.js for Webuzo/Passenger
          if [ -f deploy/server.js ]; then
            node -e "const fs=require('fs');const p='deploy/server.js';let s=fs.readFileSync(p,'utf8');s=s.replace(\"process.env.HOSTNAME || '0.0.0.0'\", \"process.env.HOSTNAME || '127.0.0.1'\");fs.writeFileSync(p,s);"
            cp deploy/server.js deploy/app.js
          fi

          if [ -f deploy/package.json ]; then
            node -e "const fs=require('fs');const p='deploy/package.json';const pkg=JSON.parse(fs.readFileSync(p,'utf8'));pkg.scripts={start:'node server.js'};pkg.main='server.js';pkg.engines={node:'20.x'};fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          fi

          # Write production environment files
          {
            echo "NODE_ENV=production"
            echo "HOSTNAME=127.0.0.1"
            echo "PORT=3000"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "MONGODB_URI=${MONGODB_URI}"
            echo "REVALIDATE_SECRET=${REVALIDATE_SECRET}"
            echo "ADMIN_DEMO_USER=${ADMIN_DEMO_USER}"
            echo "ADMIN_DEMO_PIN=${ADMIN_DEMO_PIN}"
          } > deploy/.env.production
          cp deploy/.env.production deploy/.env

      - name: Deploy to Webuzo via FTP (Port 21)
        if: env.DEPLOY_PORT == '21'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.DEPLOY_SERVER }}
          username: ${{ env.DEPLOY_USERNAME }}
          password: ${{ env.DEPLOY_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ env.DEPLOY_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**

      - name: Deploy to Webuzo via SFTP / SSH (Port 22 or other)
        if: env.DEPLOY_PORT != '21'
        run: |
          echo "Installing sshpass and rsync..."
          sudo apt-get update -y && sudo apt-get install -y sshpass rsync

          REMOTE_DIR="${DEPLOY_REMOTE_DIR%/}"
          SSH_OPTS="-p ${DEPLOY_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          if [ -n "${SSH_PRIVATE_KEY}" ]; then
            echo "Deploying with SSH Private Key on port ${DEPLOY_PORT}..."
            mkdir -p ~/.ssh
            echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa

            ssh ${SSH_OPTS} -i ~/.ssh/id_rsa "${DEPLOY_USERNAME}@${DEPLOY_SERVER}" "mkdir -p ${REMOTE_DIR}"
            rsync -avz --delete -e "ssh ${SSH_OPTS} -i ~/.ssh/id_rsa" ./deploy/ "${DEPLOY_USERNAME}@${DEPLOY_SERVER}:${REMOTE_DIR}/"
          elif [ -n "${DEPLOY_PASSWORD}" ]; then
            echo "Deploying with SSH/SFTP Password on port ${DEPLOY_PORT}..."
            sshpass -p "${DEPLOY_PASSWORD}" ssh ${SSH_OPTS} "${DEPLOY_USERNAME}@${DEPLOY_SERVER}" "mkdir -p ${REMOTE_DIR}"
            sshpass -p "${DEPLOY_PASSWORD}" rsync -avz --delete -e "ssh ${SSH_OPTS}" ./deploy/ "${DEPLOY_USERNAME}@${DEPLOY_SERVER}:${REMOTE_DIR}/"
          fi

          echo "🚀 Deployment to Webuzo via SFTP/SSH completed successfully!"
